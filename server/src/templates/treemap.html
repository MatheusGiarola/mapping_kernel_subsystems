<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title> Treemap PoC</title>

        <script src="https://cdn.plot.ly/plotly-3.3.0.min.js" charset="utf-8"></script>
	</head>
	<body>

        <div id="plotlyCanvas" style="width:1600px;height:900px;">

        </div>

        <script type="text/javascript">

            const data = [{
                type: "treemap",
                maxdepth: {{maxdepth}},
                hoverinfo: "text",
                hovertext: {{treemap_data["actual_sizes"]|safe}},
                ids: {{treemap_data["ids"]|safe}},
                //labels: [""],
                labels: {{treemap_data["labels"]|safe}},
                parents: {{treemap_data["parents"]|safe}},
                values: {{treemap_data["sizes"]}},
                marker: {colors: {{treemap_data["colors"]|safe}}}
            }]


            Plotly.newPlot('plotlyCanvas', data)
		</script>

	</body>
</html>
